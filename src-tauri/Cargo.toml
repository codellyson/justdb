[package]
name = "justdb"
version = "0.2.4"
description = "JustDB desktop"
authors = ["KreativeKorna"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "justdb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"

tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-float", "db-postgres"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# libsql speaks both local SQLite files (`Builder::new_local`) and remote
# Turso/sqld (`Builder::new_remote`) through the same Connection API, so a
# single dep covers both `sqlite:` and `libsql://` URLs. `default-features
# = false` drops the encryption + replication features we don't ship; we
# explicitly enable `core` (the local file backend) and `remote` (the HTTP
# transport for Turso).
libsql = { version = "0.9", default-features = false, features = ["core", "remote", "tls"] }
async-trait = "0.1"

# AI provider calls (Anthropic Messages API). There's no official Rust SDK,
# so this is a plain JSON POST. `native-tls` reuses the TLS stack already
# pulled in by postgres-native-tls rather than adding rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tauri-plugin-aptabase = "1.0.0"

# Single-instance is only needed on Windows + Linux. macOS's LaunchServices
# already enforces single-instance for bundled apps, so we target-gate to
# avoid pulling the crate (and its dbus dep) into the macOS build.
# The `deep-link` feature forwards the justdb:// URL from a would-be second
# instance into the already-running first instance.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Phase 6 release-build tuning. `panic="abort"` shrinks the binary (no unwind
# tables) and matches Tauri's recommended profile; `lto=true` + single
# codegen unit let the linker do whole-program optimization at the cost of
# slower release builds (~1-2 min on this codebase); `strip = true` drops
# debug symbols from the shipped binary. Dev builds (the only thing
# `tauri:dev` touches) are unaffected.
[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
